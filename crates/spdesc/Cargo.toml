[package]
name = "spdesc"
description = "The SPDescendants client: the Bevy app that presents the simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bevy.workspace = true
# `default-features = false`: the shipped app must never bake this checkout's source-tree path
# into its data resolver (see the `dev` feature in spdesc-game-core).
spdesc-game-core = { path = "../spdesc-game-core", default-features = false }
# The runtime asset reader: container, Zen package, `USkeletalMesh` render data, `UTexture2D`.
# `default-features = false` for the same reason as `spdesc-game-core`.
spdesc-data = { path = "../spdesc-data", default-features = false }

[lints]
workspace = true
